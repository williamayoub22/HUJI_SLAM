[tool.ruff]
target-version = "py311"
line-length = 100
src = ["code"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplifications
]
ignore = [
    "E501", # formatter handles line length reasonably
]

[tool.ruff.lint.per-file-ignores]
"code/ex*.py" = ["E402"]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
mypy_path = "code"
ignore_missing_imports = true
check_untyped_defs = true